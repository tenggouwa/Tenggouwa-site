# 直连回源模板：部署到 /etc/nginx/sites-available/tenggouwa-api，
# 再 ln -s 到 sites-enabled。Cloudflare 保持橙云代理，使用 Origin Certificate。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tenggouwa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.tenggouwa.com;

    ssl_certificate     /etc/nginx/ssl/api.tenggouwa.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.tenggouwa.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    # CORS 由 FastAPI 处理；WS 头必须透传给 Agent/Mac Agent 通道。
    location / {
        proxy_pass http://127.0.0.1:10095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
