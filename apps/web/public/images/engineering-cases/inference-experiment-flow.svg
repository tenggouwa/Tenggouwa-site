<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">让容量实验可以被复核</title><desc id="desc">热态分阶段工作负载 · MTP 与前缀缓存都有适用条件。目标阶段与排空时间分别报告；不把热态实验外推为冷启动承诺。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">让容量实验可以被复核</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">热态分阶段工作负载 · MTP 与前缀缓存都有适用条件</text><rect x="42" y="145" width="1116" height="110" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="181" fill="#67e8a5" font-size="25" text-anchor="start">固定条件</text><text x="62" y="219" fill="#a8bac9" font-size="21" text-anchor="start">四卡服务 / 固定多轮数据集 / 相同请求策略 / 指定缓存与引擎配置</text><path d="M600,255 L600,295" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="42" y="315" width="340" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="351" fill="#67e8a5" font-size="25" text-anchor="start">分阶段进入</text><text x="62" y="389" fill="#a8bac9" font-size="21" text-anchor="start">C16 → C32 → C55</text><text x="62" y="420" fill="#a8bac9" font-size="21" text-anchor="start">每阶段约 90 秒</text><rect x="430" y="315" width="340" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="450" y="351" fill="#67e8a5" font-size="25" text-anchor="start">目标阶段</text><text x="450" y="389" fill="#a8bac9" font-size="21" text-anchor="start">指定 C，发压 600 秒</text><text x="450" y="420" fill="#a8bac9" font-size="21" text-anchor="start">保留逐请求与遥测</text><rect x="818" y="315" width="340" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="838" y="351" fill="#67e8a5" font-size="25" text-anchor="start">完整收尾</text><text x="838" y="389" fill="#a8bac9" font-size="21" text-anchor="start">停止发压后排空</text><text x="838" y="420" fill="#a8bac9" font-size="21" text-anchor="start">完成 / 错误 / 取消</text><path d="M382,394 L430,394" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770,394 L818,394" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="42" y="525" width="1116" height="110" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="561" fill="#67e8a5" font-size="25" text-anchor="start">同时检查质量门槛</text><text x="62" y="599" fill="#a8bac9" font-size="21" text-anchor="start">TTFT P95 ≤ 10s；速度 P25 ≥ 20 token/s；全完成，零错误与取消</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">目标阶段与排空时间分别报告；不把热态实验外推为冷启动承诺。</text></g></svg>