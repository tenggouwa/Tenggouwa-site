<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">核心查询：约 660ms → 37ms</title><desc id="desc">历史隔离验证 · 条形长度与查询耗时成比例。这是查询层结果，不代表当前线上延迟、长期吞吐或月度 SLA。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">核心查询：约 660ms → 37ms</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">历史隔离验证 · 条形长度与查询耗时成比例</text><text x="45" y="170" fill="#75d6ef" font-size="26" text-anchor="start">隔离数据规模：约 16 万条历史记录</text><text x="45" y="270" fill="#e0e8f0" font-size="25" text-anchor="start">优化前</text><rect x="220" y="235" width="790" height="62" rx="10" fill="#f5d483" stroke="#f5d483" stroke-width="2"/><text x="1032" y="275" fill="#f5d483" font-size="27" text-anchor="start">约 660 ms</text><text x="45" y="405" fill="#e0e8f0" font-size="25" text-anchor="start">优化后</text><rect x="220" y="370" width="44" height="62" rx="10" fill="#67e8a5" stroke="#67e8a5" stroke-width="2"/><text x="286" y="410" fill="#67e8a5" font-size="27" text-anchor="start">约 37 ms</text><rect x="42" y="505" width="1116" height="125" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="541" fill="#67e8a5" font-size="25" text-anchor="start">查询耗时下降约 94%</text><text x="62" y="579" fill="#a8bac9" font-size="21" text-anchor="start">同环境对照，金额结果一致；不是整个接口的 17.8 倍加速。</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">这是查询层结果，不代表当前线上延迟、长期吞吐或月度 SLA。</text></g></svg>