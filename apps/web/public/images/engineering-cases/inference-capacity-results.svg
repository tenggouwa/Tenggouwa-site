<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">热态达标并发提升约 63.5%</title><desc id="desc">实验观察：104 → 170；不表示吞吐、收入或利用率同比例增长。C 是整套四卡服务的客户端在途上限；冷态和生产放量另行验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">热态达标并发提升约 63.5%</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">实验观察：104 → 170；不表示吞吐、收入或利用率同比例增长</text><text x="42" y="155" fill="#75d6ef" font-size="26" text-anchor="start">最高通过档位（固定热态条件）</text><text x="42" y="227" fill="#e0e8f0" font-size="25" text-anchor="start">无 MTP</text><rect x="220" y="190" width="457.6" height="58" rx="10" fill="#f5d483" stroke="#f5d483" stroke-width="2"/><text x="697.6" y="229" fill="#f5d483" font-size="29" text-anchor="start">104</text><text x="42" y="327" fill="#e0e8f0" font-size="25" text-anchor="start">MTP 方案</text><rect x="220" y="290" width="748.0000000000001" height="58" rx="10" fill="#67e8a5" stroke="#67e8a5" stroke-width="2"/><text x="988.0000000000001" y="329" fill="#67e8a5" font-size="29" text-anchor="start">170</text><rect x="42" y="405" width="540" height="190" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="441" fill="#67e8a5" font-size="25" text-anchor="start">C170：通过</text><text x="62" y="479" fill="#a8bac9" font-size="21" text-anchor="start">1,604 / 1,604 完成，零错误</text><text x="62" y="510" fill="#a8bac9" font-size="21" text-anchor="start">TTFT P95 ≈ 1.66 秒</text><text x="62" y="541" fill="#a8bac9" font-size="21" text-anchor="start">速度 P25 ≈ 25.43 token/s</text><rect x="618" y="405" width="540" height="190" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="638" y="441" fill="#f5d483" font-size="25" text-anchor="start">C171：未通过</text><text x="638" y="479" fill="#a8bac9" font-size="21" text-anchor="start">虽然全部完成，质量仍未达标</text><text x="638" y="510" fill="#a8bac9" font-size="21" text-anchor="start">TTFT P95 ≈ 16.94 秒</text><text x="638" y="541" fill="#a8bac9" font-size="21" text-anchor="start">速度 P25 ≈ 14.30 token/s</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">C 是整套四卡服务的客户端在途上限；冷态和生产放量另行验证。</text></g></svg>