<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">客服 Agent 的受控上下文链</title><desc id="desc">工程逻辑示意 · 工具事实、客户自述和知识来源保持区分。服务端决定状态与许可；模型在计划内组织自然语言。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">客服 Agent 的受控上下文链</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">工程逻辑示意 · 工具事实、客户自述和知识来源保持区分</text><rect x="42" y="145" width="536" height="158" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="181" fill="#67e8a5" font-size="25" text-anchor="start">输入契约</text><text x="62" y="219" fill="#a8bac9" font-size="21" text-anchor="start">客户 / 客服 / 系统角色</text><text x="62" y="250" fill="#a8bac9" font-size="21" text-anchor="start">本轮有效语言</text><rect x="622" y="145" width="536" height="158" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="642" y="181" fill="#67e8a5" font-size="25" text-anchor="start">会话状态</text><text x="642" y="219" fill="#a8bac9" font-size="21" text-anchor="start">主诉 / 已知事实与来源</text><text x="642" y="250" fill="#a8bac9" font-size="21" text-anchor="start">已执行步骤 / 材料状态</text><rect x="622" y="385" width="536" height="158" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="642" y="421" fill="#67e8a5" font-size="25" text-anchor="start">回复计划</text><text x="642" y="459" fill="#a8bac9" font-size="21" text-anchor="start">允许追问的未知项</text><text x="642" y="490" fill="#a8bac9" font-size="21" text-anchor="start">知识、工具与人工边界</text><rect x="42" y="385" width="536" height="158" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="421" fill="#67e8a5" font-size="25" text-anchor="start">生成与校验</text><text x="62" y="459" fill="#a8bac9" font-size="21" text-anchor="start">围绕计划组织语言</text><text x="62" y="490" fill="#a8bac9" font-size="21" text-anchor="start">重复追问与事实校验</text><path d="M578,224 L622,224" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M890,303 L890,362" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M622,464 L578,464" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="42" y="614" fill="#75d6ef" font-size="24" text-anchor="start">持久化状态、消息与证据，供下一轮继续使用</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">服务端决定状态与许可；模型在计划内组织自然语言。</text></g></svg>