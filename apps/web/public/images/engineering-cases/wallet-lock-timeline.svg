<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">慢查询如何被行锁放大</title><desc id="desc">时间线仅解释串行机制，不是生产采样，也不按真实耗时绘制。不要把示意时间线当作吞吐预测；实际结果取决于并发与事务行为。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">慢查询如何被行锁放大</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">时间线仅解释串行机制，不是生产采样，也不按真实耗时绘制</text><text x="45" y="155" fill="#75d6ef" font-size="25" text-anchor="start">同一客户，多次请求共享钱包行锁</text><text x="42" y="249" fill="#e0e8f0" font-size="24" text-anchor="start">请求 A</text><rect x="200" y="215" width="255" height="56" rx="10" fill="#163c32" stroke="#67e8a5" stroke-width="2"/><text x="327" y="251" fill="#e0e8f0" font-size="21" text-anchor="middle">锁内检查与预占</text><text x="42" y="361" fill="#e0e8f0" font-size="24" text-anchor="start">请求 B</text><rect x="200" y="327" width="255" height="56" rx="10" fill="#365064" stroke="#365064" stroke-width="2"/><text x="327.5" y="363" fill="#e0e8f0" font-size="22" text-anchor="middle">等待锁</text><rect x="455" y="327" width="255" height="56" rx="10" fill="#163c32" stroke="#67e8a5" stroke-width="2"/><text x="582" y="363" fill="#e0e8f0" font-size="21" text-anchor="middle">锁内检查与预占</text><text x="42" y="473" fill="#e0e8f0" font-size="24" text-anchor="start">请求 C</text><rect x="200" y="439" width="510" height="56" rx="10" fill="#365064" stroke="#365064" stroke-width="2"/><text x="455.0" y="475" fill="#e0e8f0" font-size="22" text-anchor="middle">等待锁</text><rect x="710" y="439" width="255" height="56" rx="10" fill="#163c32" stroke="#67e8a5" stroke-width="2"/><text x="837" y="475" fill="#e0e8f0" font-size="21" text-anchor="middle">锁内检查与预占</text><rect x="42" y="565" width="1116" height="74" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="601" fill="#67e8a5" font-size="25" text-anchor="start">机制示意：缩短持锁工作量，才能减少后续请求等待</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">不要把示意时间线当作吞吐预测；实际结果取决于并发与事务行为。</text></g></svg>