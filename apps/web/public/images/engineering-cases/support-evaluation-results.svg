<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">上下文错误减少，不等于全部问题解决</title><desc id="desc">历史离线同批回放 · 非线上自动解决率。分类结果与整体结果同时报告；评审协议变化后需要重建基线。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">上下文错误减少，不等于全部问题解决</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">历史离线同批回放 · 非线上自动解决率</text><text x="42" y="158" fill="#75d6ef" font-size="25" text-anchor="start">上下文类失败（属于失败子集）</text><text x="42" y="229" fill="#e0e8f0" font-size="24" text-anchor="start">修复前</text><rect x="230" y="195" width="702" height="52" rx="10" fill="#f5d483" stroke="#f5d483" stroke-width="2"/><text x="952" y="230" fill="#f5d483" font-size="26" text-anchor="start">39 条</text><text x="42" y="319" fill="#e0e8f0" font-size="24" text-anchor="start">修复后</text><rect x="230" y="285" width="216" height="52" rx="10" fill="#67e8a5" stroke="#67e8a5" stroke-width="2"/><text x="466" y="320" fill="#67e8a5" font-size="26" text-anchor="start">12 条</text><rect x="42" y="407" width="1116" height="190" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="443" fill="#67e8a5" font-size="25" text-anchor="start">固定 500 条完整回归</text><text x="62" y="481" fill="#a8bac9" font-size="21" text-anchor="start">整体通过数：399 → 409；通过比例：79.8% → 81.8%</text><text x="62" y="512" fill="#a8bac9" font-size="21" text-anchor="start">上下文类失败：39 → 12，减少约 69%</text><text x="62" y="543" fill="#a8bac9" font-size="21" text-anchor="start">剩余失败和待复核保留；定向修复不能加进全量结果。</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">分类结果与整体结果同时报告；评审协议变化后需要重建基线。</text></g></svg>