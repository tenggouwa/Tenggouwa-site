<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">一条模型请求的三组责任</title><desc id="desc">逻辑架构示意 · 不对应实际部署节点。控制面决定版本；数据面执行请求；账务证据支持核对。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">一条模型请求的三组责任</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">逻辑架构示意 · 不对应实际部署节点</text><rect x="42" y="140" width="1116" height="120" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="176" fill="#67e8a5" font-size="25" text-anchor="start">控制面：管理与发布</text><text x="62" y="214" fill="#a8bac9" font-size="21" text-anchor="start">模型能力 / 部署与密钥引用 / 组织权限 / 价格 / 路由 → 已发布配置版本</text><path d="M600,260 L600,303" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="42" y="320" width="258" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="356" fill="#67e8a5" font-size="25" text-anchor="start">调用方</text><text x="62" y="394" fill="#a8bac9" font-size="21" text-anchor="start">应用 / Agent</text><rect x="328" y="320" width="500" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="348" y="356" fill="#67e8a5" font-size="25" text-anchor="start">数据面</text><text x="348" y="394" fill="#a8bac9" font-size="21" text-anchor="start">鉴权 → 预算与并发准入</text><text x="348" y="425" fill="#a8bac9" font-size="21" text-anchor="start">路由 → 适配 → SSE 返回</text><rect x="900" y="320" width="258" height="155" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="920" y="356" fill="#67e8a5" font-size="25" text-anchor="start">模型服务</text><text x="920" y="394" fill="#a8bac9" font-size="21" text-anchor="start">候选部署</text><text x="920" y="425" fill="#a8bac9" font-size="21" text-anchor="start">只在允许窗口切换</text><path d="M300,395 L328,395" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M828,395 L900,395" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M580,475 L580,522" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="328" y="535" width="500" height="100" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="348" y="571" fill="#67e8a5" font-size="25" text-anchor="start">请求、尝试与账务证据</text><text x="348" y="609" fill="#a8bac9" font-size="21" text-anchor="start">终态 / usage / 价格快照 / 待确认成本</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">控制面决定版本；数据面执行请求；账务证据支持核对。</text></g></svg>