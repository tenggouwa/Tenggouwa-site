<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">响应成功与账务确认分别建模</title><desc id="desc">设计原则示意 · 两个维度可以处于不同阶段。请求可追踪，资金有来源；缺失信息不能被“成功”标签抹平。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#75d6ef"/></marker></defs><rect width="1200" height="700" fill="#0b1118"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="42" y="55" fill="#67e8a5" font-size="32" text-anchor="start">响应成功与账务确认分别建模</text><text x="42" y="95" fill="#a8bac9" font-size="21" text-anchor="start">设计原则示意 · 两个维度可以处于不同阶段</text><rect x="42" y="155" width="1116" height="170" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="191" fill="#67e8a5" font-size="25" text-anchor="start">响应处理维度</text><text x="62" y="229" fill="#a8bac9" font-size="21" text-anchor="start">准入 → 上游尝试 → 流式返回 → 终止帧 / 连接结果</text><text x="62" y="260" fill="#a8bac9" font-size="21" text-anchor="start">上游结束、下游交付和 HTTP 关闭分别保留证据</text><rect x="42" y="395" width="1116" height="170" rx="10" fill="#121d29" stroke="#365064" stroke-width="2"/><text x="62" y="431" fill="#67e8a5" font-size="25" text-anchor="start">账务确认维度</text><text x="62" y="469" fill="#a8bac9" font-size="21" text-anchor="start">预占 → 有效用量 → 客户结算 / 供应商成本确认</text><text x="62" y="500" fill="#a8bac9" font-size="21" text-anchor="start">用量已知但成本未确认时，状态保持待确认，不填写零成本</text><path d="M600,325 L600,395" stroke="#75d6ef" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="625" y="368" fill="#75d6ef" font-size="22" text-anchor="start">通过请求与尝试关联</text><text x="42" y="672" fill="#a8bac9" font-size="19" text-anchor="start">请求可追踪，资金有来源；缺失信息不能被“成功”标签抹平。</text></g></svg>