<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tenggouwa · admin</title>
    <script>
      // 配合 404.html：把刷新 deep link 时丢失的原始 URL 还原回 history。
      // location.pathname 是兜底跳回的 admin 根，两种部署都适用：
      // ghpages=/Tenggouwa-site/admin/，根域=/admin/。
      (function () {
        try {
          var r = sessionStorage.getItem('tg_spa_redirect');
          if (!r) return;
          sessionStorage.removeItem('tg_spa_redirect');
          if (r.indexOf(location.pathname) !== 0) return;
          if (r === location.pathname + location.search + location.hash) return;
          history.replaceState(null, '', r);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
